# The PUBLIC service (App Engine's "default" service).
#
# Serves show pages, feeds and the download-counting redirect to listeners and
# podcast apps. It contains no admin routes. Custom domains map to this service.
# The admin runs as a second service from the same code: see admin.yaml.
runtime: python313
# Scales to zero when idle; F1 is the smallest (free-tier) instance class.
instance_class: F1
automatic_scaling:
  min_instances: 0
  max_instances: 2

env_variables:
  BUCKETCAST_ROLE: "public"
  BUCKETCAST_BUCKET: "your-bucket-name"
  # Optional: the BigQuery table the download-log sink writes to.
  BUCKETCAST_STATS_BQ_TABLE: ""

handlers:
  - url: /.*
    script: auto
    secure: always
