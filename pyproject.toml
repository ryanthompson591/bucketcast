[project]
name = "bucketcast"
version = "0.0.1"
description = "A very lightweight, self-hosted podcast host for Google Cloud"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
