<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bucketcast admin{% endblock %}</title>
  <style>
    :root { --fg:#1d1d1f; --muted:#6e6e73; --line:#d9d9de; --bg:#fafafa; --accent:#2f5bea; --err:#c62828; }
    * { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg);
           background: var(--bg); margin: 0; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; }
    header a { color: inherit; text-decoration: none; font-weight: 650; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 14px 20px; }
    h1 { font-size: 1.5rem; margin: 8px 0 18px; }
    a { color: var(--accent); }
    .notice { background: #e8f5e9; border: 1px solid #b7dfb9; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; }
    .error-box { background: #fdecea; border: 1px solid #f5c2c0; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; color: var(--err); }
    .muted { color: var(--muted); font-size: .9rem; }
    .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
           padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #fff; color: var(--fg); border: 1px solid var(--line); }
    .btn.danger { background: #fff; color: var(--err); border: 1px solid #f5c2c0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
    .shows { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .show { display: flex; gap: 14px; align-items: center; }
    .show img, .show .ph { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #e8e8ed; flex: none; }
    .show h2 { font-size: 1.05rem; margin: 0; }
    form .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=number], input[type=datetime-local], textarea, select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    progress { width: 100%; height: 10px; margin-top: 10px; accent-color: var(--accent); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.small { padding: 5px 10px; font-size: .85rem; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .tile .label { color: var(--muted); font-size: .85rem; }
    .tile .value { font-size: 1.9rem; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .ranges { display: flex; gap: 6px; flex-wrap: wrap; }
    .ranges a { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--fg); background: #fff; font-size: .9rem; }
    .ranges a.on { background: var(--fg); color: #fff; border-color: var(--fg); }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; }
    .chart .bar { fill: var(--accent); }
    .chart .hit { fill: transparent; }
    .chart .hit:hover + .bar, .chart .hit:focus + .bar { fill: #1d3fb5; }
    .chart .grid { stroke: var(--line); stroke-width: 1; }
    .chart .axis { stroke: #b9b9c0; stroke-width: 1; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .chart-tip { position: absolute; pointer-events: none; background: var(--fg); color: #fff; font-size: .8rem; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }
    table.data { width: 100%; border-collapse: collapse; }
    table.data th, table.data td { text-align: left; padding: 7px 0; border-bottom: 1px solid var(--line); }
    table.data th { font-size: .85rem; color: var(--muted); font-weight: 600; }
    table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.data tr:last-child td { border-bottom: 0; }
    .meter { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }
    @media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
    .assets { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px;
              grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .asset { padding: 12px; }
    .asset img { width: 100%; height: 130px; object-fit: contain; background: #f0f0f3; border-radius: 8px; display: block; }
    .asset-name { font-weight: 600; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .asset-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .notes-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .notes-preview { border: 1px dashed var(--line); border-radius: 8px; padding: 4px 14px; margin-top: 10px; background: var(--bg); }
    .notes-preview img { max-width: 100%; height: auto; border-radius: 6px; }
    .notes-preview:empty::before { content: "Nothing to preview yet."; color: var(--muted); font-size: .9rem; display: block; padding: 8px 0; }
    dialog.picker { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; width: min(640px, 92vw); }
    dialog.picker::backdrop { background: rgba(0, 0, 0, .35); }
    .picker-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); margin: 12px 0; max-height: 50vh; overflow: auto; }
    .picker-grid button { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 6px; cursor: pointer; font: inherit; font-size: .8rem; }
    .picker-grid button:hover, .picker-grid button:focus { border-color: var(--accent); }
    .picker-grid img { width: 100%; height: 90px; object-fit: contain; display: block; margin-bottom: 4px; }
    .picker-grid span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    textarea { min-height: 120px; resize: vertical; }
    .err { color: var(--err); font-size: .9rem; margin-top: 4px; }
    .invalid { border-color: var(--err) !important; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .check label { display: inline; font-weight: 500; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a href="{{ url_for('admin.index') }}">🪣 Bucketcast</a>
    <span class="muted">{{ g.admin_email }}</span>
  </div></header>
  <main class="wrap">
    {% if request.args.get('notice') %}<div class="notice">{{ request.args.get('notice') }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
