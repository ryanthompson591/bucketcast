<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bucketcast admin{% endblock %}</title>
  <style>
    :root { --fg:#1d1d1f; --muted:#6e6e73; --line:#d9d9de; --bg:#fafafa; --accent:#2f5bea; --err:#c62828; }
    * { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg);
           background: var(--bg); margin: 0; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; }
    header a { color: inherit; text-decoration: none; font-weight: 650; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 14px 20px; }
    h1 { font-size: 1.5rem; margin: 8px 0 18px; }
    a { color: var(--accent); }
    .notice { background: #e8f5e9; border: 1px solid #b7dfb9; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; }
    .error-box { background: #fdecea; border: 1px solid #f5c2c0; padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; color: var(--err); }
    .muted { color: var(--muted); font-size: .9rem; }
    .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
           padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #fff; color: var(--fg); border: 1px solid var(--line); }
    .btn.danger { background: #fff; color: var(--err); border: 1px solid #f5c2c0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
    .shows { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .show { display: flex; gap: 14px; align-items: center; }
    .show img, .show .ph { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #e8e8ed; flex: none; }
    .show h2 { font-size: 1.05rem; margin: 0; }
    form .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=number], input[type=datetime-local], textarea, select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    progress { width: 100%; height: 10px; margin-top: 10px; accent-color: var(--accent); }
    .btn:disabled { opacity: .55; cursor: default; }
    textarea { min-height: 120px; resize: vertical; }
    .err { color: var(--err); font-size: .9rem; margin-top: 4px; }
    .invalid { border-color: var(--err) !important; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .check label { display: inline; font-weight: 500; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a href="{{ url_for('admin.index') }}">🪣 Bucketcast</a>
    <span class="muted">{{ g.admin_email }}</span>
  </div></header>
  <main class="wrap">
    {% if request.args.get('notice') %}<div class="notice">{{ request.args.get('notice') }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
